limit_req_zone $binary_remote_addr zone=vipi_initial_per_ip:10m rate=100r/s;
map $uri $vipi_referrer_policy {
    default no-referrer;
    ~^/delete-account same-origin;
}
map $http_upgrade $vipi_upgrade_connection {
    default upgrade;
    '' close;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mambovipi.app;
    ssl_certificate /etc/letsencrypt/live/api.mambovipi.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mambovipi.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    error_log /var/log/nginx/vipi-error.log crit;
    client_max_body_size 100k;
    client_body_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy $vipi_referrer_policy always;
    location = /.well-known/apple-app-site-association {
        alias /srv/vipi-associations/releases/7b7a1195edefef8c/apple-app-site-association;
        types { }
        default_type application/json;
        limit_except GET { deny all; }
        limit_req zone=vipi_initial_per_ip burst=200 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/vipi-marketing-access.log;
    }
    location = /.well-known/assetlinks.json {
        alias /srv/vipi-associations/releases/7b7a1195edefef8c/assetlinks.json;
        types { }
        default_type application/json;
        limit_except GET { deny all; }
        limit_req zone=vipi_initial_per_ip burst=200 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/vipi-marketing-access.log;
    }
    location = /privacy {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 302 https://mambovipi.app/privacy.html;
    }
    location = /terms {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 302 https://mambovipi.app/terms.html;
    }
    # Originals and thumbnails already contain their authentication tag and nonce.
    location ~ "^/v1/media/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/ciphertext$" {
        client_max_body_size 33554460;
        limit_req zone=vipi_initial_per_ip burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:48943;
        proxy_http_version 1.1;
        proxy_set_header Host api.mambovipi.app;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Referrer-Policy;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 125s;
        proxy_connect_timeout 3s;
    }
    location = /health/ready { deny all; }
    location / {
        limit_req zone=vipi_initial_per_ip burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:48943;
        proxy_hide_header Referrer-Policy;
        proxy_http_version 1.1;
        proxy_set_header Host api.mambovipi.app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vipi_upgrade_connection;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 35s;
        proxy_connect_timeout 3s;
    }
}
