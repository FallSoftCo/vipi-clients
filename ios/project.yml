name: Vipi
configs:
  Debug: debug
  Simulator: debug
  Release: release
options:
  bundleIdPrefix: co.fallsoft
  # CocoaPods requires opening Vipi.xcworkspace.
  schemePathPrefix: ../
  deploymentTarget:
    iOS: '18.0'
settings:
  configs:
    Simulator:
      'EXCLUDED_ARCHS[sdk=iphonesimulator*]': ''
      # No ML Kit simulator-arm64 binary exists. This UI-only configuration
      # compiles the explicit unavailable adapter, not a substitute translator.
      OTHER_LDFLAGS: '-lsqlite3 -lc++'
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: 3TNL2455JT
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '6'
    CODE_SIGN_STYLE: Automatic
    # CocoaPods copies its pinned SDK resource bundles using rsync staging files.
    # This affects build scripts only, not the installed application's sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  ESpeakNG:
    url: https://github.com/espeak-ng/espeak-ng-spm.git
    revision: fd28f6460cc4cdf631528c8e2f7bd825747aac5c
  VipiCore:
    path: VipiCore
  WorkOS:
    url: https://github.com/workos/workos-ios
    exactVersion: 0.8.0
  LibSignalClient:
    path: ../vendor/libsignal/source/swift
targets:
  Vipi:
    type: application
    platform: iOS
    sources:
      - path: Vipi
        excludes: [ThirdPartyNotices]
      - path: Vipi/ThirdPartyNotices
        type: folder
        buildPhase: resources
      - path: ../data/readings/chinese-ordinary.json
        buildPhase: resources
    dependencies:
      - target: VipiNotificationService
      - sdk: libz.tbd
      - package: ESpeakNG
        product: libespeak-ng
      - package: ESpeakNG
        product: espeak-ng-data
      - package: VipiCore
      - package: WorkOS
      - package: LibSignalClient
    preBuildScripts:
      - name: Verify production configuration
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          # Release auth is deliberately supplied by the release environment.
          if [ "${CONFIGURATION:-}" != "Release" ]; then
              exit 0
          fi
          case "${WORKOS_CLIENT_ID:-}" in
              client_01M5S2CDSQ8F7FEX26G3CY9VS1)
                  echo "error: Vipi Release cannot use the staging WorkOS client." >&2
                  exit 1
                  ;;
              client_*)
                  client_suffix=${WORKOS_CLIENT_ID#client_}
                  case "$client_suffix" in
                      ""|*[!A-Za-z0-9]*)
                          echo "error: Supply a valid public WorkOS client identifier for Vipi Release." >&2
                          exit 1
                          ;;
                  esac
                  ;;
              *)
                  echo "error: Set WORKOS_CLIENT_ID to the production public WorkOS client identifier for Vipi Release." >&2
                  exit 1
                  ;;
          esac
          if [ "${VIPI_PUSH_ENVIRONMENT:-}" != "production" ]; then
              echo "error: Vipi Release requires VIPI_PUSH_ENVIRONMENT=production." >&2
              exit 1
          fi
    postBuildScripts:
      - name: Package verified Swahili speech data
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          python3 "${SRCROOT}/package-swahili-speech.py"
      - name: Preserve static ML Kit privacy manifests
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          python3 "${SRCROOT}/package-mlkit-privacy.py"
    info:
      path: Vipi/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [co.fallsoft.vipi]
            CFBundleURLName: co.fallsoft.vipi.auth
        VipiNotificationKeyGroup: $(AppIdentifierPrefix)co.fallsoft.vipi.notification-access
        NSContactsUsageDescription: Choose a phone contact to invite. Names, numbers and email addresses stay on this device.
        WorkOSClientID: $(WORKOS_CLIENT_ID)
        VipiPushEnvironment: $(VIPI_PUSH_ENVIRONMENT)
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.fallsoft.vipi
        CODE_SIGN_ENTITLEMENTS: Vipi/Vipi.entitlements
        VIPI_PUSH_ENVIRONMENT: development
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vipi
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        SWIFT_STRICT_CONCURRENCY: complete
        'LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]': $(inherited) $(SRCROOT)/../vendor/libsignal/target/aarch64-apple-ios-sim/release
        'LIBRARY_SEARCH_PATHS[sdk=iphoneos*]': $(inherited) $(SRCROOT)/../vendor/libsignal/target/aarch64-apple-ios/release
      configs:
        Debug:
          WORKOS_CLIENT_ID: client_01M5S2CDSQ8F7FEX26G3CY9VS1
        Simulator:
          WORKOS_CLIENT_ID: client_01M5S2CDSQ8F7FEX26G3CY9VS1
          'EXCLUDED_ARCHS[sdk=iphonesimulator*]': ''
          OTHER_LDFLAGS: '-lsqlite3 -lc++'
        Release:
          WORKOS_CLIENT_ID: ''
          VIPI_PUSH_ENVIRONMENT: production
  VipiNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: VipiNotificationService
        excludes: [Info.plist, VipiNotificationService.entitlements]
      - path: Vipi/NotificationAccess.swift
      - path: Vipi/NotificationEnvelope.swift
      - path: Vipi/MessageVault.swift
      - path: Vipi/MessageJournal.swift
      - path: Vipi/MessagingCore.swift
      - path: Vipi/SignalKeys.swift
      - path: Vipi/DurableSignalStore.swift
      - path: Vipi/DeviceCredential.swift
      - path: Vipi/SecurityNumber.swift
      - path: Vipi/ConversationHistory.swift
      - path: Vipi/HistoryBackupCodec.swift
    dependencies:
      - package: LibSignalClient
    info:
      path: VipiNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Vipi Notifications
        VipiNotificationKeyGroup: $(AppIdentifierPrefix)co.fallsoft.vipi.notification-access
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.fallsoft.vipi.NotificationService
        CODE_SIGN_ENTITLEMENTS: VipiNotificationService/VipiNotificationService.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) VIPI_NOTIFICATION_EXTENSION
        OTHER_LDFLAGS: $(inherited) -lsqlite3 -lc++
        'LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]': $(inherited) $(SRCROOT)/../vendor/libsignal/target/aarch64-apple-ios-sim/release
        'LIBRARY_SEARCH_PATHS[sdk=iphoneos*]': $(inherited) $(SRCROOT)/../vendor/libsignal/target/aarch64-apple-ios/release
  VipiCryptoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VipiCryptoTests
        excludes: [StoreKit]
      - path: ../qa/packs/signed-pack-fixtures
        type: folder
        buildPhase: resources
      - path: ../qa/backup/ascii.vipihistory
        buildPhase: resources
      - path: ../qa/backup/unicode.vipihistory
        buildPhase: resources
      - path: ../qa/backup/android-history-v1.vipihistory
        buildPhase: resources
      - path: ../qa/immersion/installer-fixture-assets/lexical-fixture
        type: folder
        buildPhase: resources
      - path: ../qa/immersion/corpus.json
        buildPhase: resources
      - path: ../qa/immersion/speech.json
        buildPhase: resources
      - path: ../qa/immersion/speech-lengths.json
        buildPhase: resources
    dependencies:
      - target: Vipi
    settings:
      configs:
        Simulator:
          'EXCLUDED_ARCHS[sdk=iphonesimulator*]': ''
          OTHER_LDFLAGS: '-lsqlite3 -lc++'
      base:
        GENERATE_INFOPLIST_FILE: YES
        'LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]': $(inherited) $(SRCROOT)/../vendor/libsignal/target/aarch64-apple-ios-sim/release
        'LIBRARY_SEARCH_PATHS[sdk=iphoneos*]': $(inherited) $(SRCROOT)/../vendor/libsignal/target/aarch64-apple-ios/release
  VipiStoreKitQualification:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VipiStoreKitQualification
      - path: VipiCryptoTests/SubscriptionFixture.swift
      - path: VipiCryptoTests/StoreKit/Vipi.storekit
        buildPhase: resources
      - path: VipiCryptoTests/StoreKit/VipiWrongBaseTrial.storekit
        buildPhase: resources
    dependencies:
      - target: Vipi
    settings:
      configs:
        Simulator:
          'EXCLUDED_ARCHS[sdk=iphonesimulator*]': ''
          OTHER_LDFLAGS: '-lsqlite3 -lc++'
      base:
        GENERATE_INFOPLIST_FILE: YES
        'LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]': $(inherited) $(SRCROOT)/../vendor/libsignal/target/aarch64-apple-ios-sim/release
        'LIBRARY_SEARCH_PATHS[sdk=iphoneos*]': $(inherited) $(SRCROOT)/../vendor/libsignal/target/aarch64-apple-ios/release
  VipiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VipiUITests]
    dependencies:
      - target: Vipi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Vipi:
    build:
      targets:
        Vipi: all
    test:
      targets: [VipiCryptoTests, VipiUITests]
  VipiSimulator:
    build:
      targets:
        Vipi: all
    run:
      config: Simulator
    test:
      config: Simulator
      targets: [VipiCryptoTests, VipiUITests]
  VipiStoreKitTests:
    build:
      targets:
        Vipi: all
    run:
      config: Simulator
      storeKitConfiguration: VipiCryptoTests/StoreKit/Vipi.storekit
    test:
      config: Simulator
      targets: [VipiStoreKitQualification]
