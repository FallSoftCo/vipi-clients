name: Vipi
configs:
  Debug: debug
  Simulator: debug
  Release: release
options:
  bundleIdPrefix: co.fallsoft
  # CocoaPods requires opening Vipi.xcworkspace.
  schemePathPrefix: ../
  deploymentTarget:
    iOS: '18.0'
settings:
  configs:
    Simulator:
      'EXCLUDED_ARCHS[sdk=iphonesimulator*]': ''
      # No ML Kit simulator-arm64 binary exists. This UI-only configuration
      # compiles the explicit unavailable adapter, not a substitute translator.
      OTHER_LDFLAGS: '-lsqlite3 -lc++'
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: 3TNL2455JT
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    # CocoaPods copies its pinned SDK resource bundles using rsync staging files.
    # This affects build scripts only, not the installed application's sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  ESpeakNG:
    url: https://github.com/espeak-ng/espeak-ng-spm.git
    revision: fd28f6460cc4cdf631528c8e2f7bd825747aac5c
  VipiCore:
    path: VipiCore
  WorkOS:
    url: https://github.com/workos/workos-ios
    exactVersion: 0.8.0
  LibSignalClient:
    path: ../vendor/libsignal/source/swift
targets:
  Vipi:
    type: application
    platform: iOS
    sources:
      - path: Vipi
        excludes: [ThirdPartyNotices]
      - path: Vipi/ThirdPartyNotices
        type: folder
        buildPhase: resources
      - path: ../data/immersion
        type: folder
        buildPhase: resources
      - path: ../data/lexical
        type: folder
        buildPhase: resources
      - path: ../data/examples/immersion-preview.json
        buildPhase: resources
      - path: ../data/examples/sentence-readings.json
        buildPhase: resources
      - path: ../data/readings/chinese-ordinary.json
        buildPhase: resources
      - path: ../qa/immersion/corpus.json
        buildPhase: resources
    dependencies:
      - sdk: libz.tbd
      - package: ESpeakNG
        product: libespeak-ng
      - package: ESpeakNG
        product: espeak-ng-data
      - package: VipiCore
      - package: WorkOS
      - package: LibSignalClient
    info:
      path: Vipi/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [co.fallsoft.vipi]
            CFBundleURLName: co.fallsoft.vipi.auth
        WorkOSClientID: $(WORKOS_CLIENT_ID)
        VipiPushEnvironment: $(VIPI_PUSH_ENVIRONMENT)
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.fallsoft.vipi
        CODE_SIGN_ENTITLEMENTS: Vipi/Vipi.entitlements
        VIPI_PUSH_ENVIRONMENT: development
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vipi
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        SWIFT_STRICT_CONCURRENCY: complete
        'LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]': $(inherited) $(SRCROOT)/../vendor/libsignal/target/aarch64-apple-ios-sim/release
        'LIBRARY_SEARCH_PATHS[sdk=iphoneos*]': $(inherited) $(SRCROOT)/../vendor/libsignal/target/aarch64-apple-ios/release
      configs:
        Debug:
          WORKOS_CLIENT_ID: client_01M5S2CDSQ8F7FEX26G3CY9VS1
        Simulator:
          WORKOS_CLIENT_ID: client_01M5S2CDSQ8F7FEX26G3CY9VS1
          'EXCLUDED_ARCHS[sdk=iphonesimulator*]': ''
          OTHER_LDFLAGS: '-lsqlite3 -lc++'
        Release:
          WORKOS_CLIENT_ID: ''
          VIPI_PUSH_ENVIRONMENT: production
  VipiCryptoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VipiCryptoTests
        excludes: [StoreKit]
      - path: VipiCryptoTests/StoreKit/Vipi.storekit
        buildPhase: resources
      - path: ../qa/packs/signed-pack-fixtures
        type: folder
        buildPhase: resources
      - path: ../qa/backup/ascii.vipihistory
        buildPhase: resources
      - path: ../qa/backup/unicode.vipihistory
        buildPhase: resources
      - path: ../qa/backup/android-history-v1.vipihistory
        buildPhase: resources
      - path: ../qa/immersion/installer-fixture-assets/lexical-fixture
        type: folder
        buildPhase: resources
      - path: ../qa/immersion/corpus.json
        buildPhase: resources
      - path: ../qa/immersion/speech.json
        buildPhase: resources
      - path: ../qa/immersion/speech-lengths.json
        buildPhase: resources
    dependencies:
      - target: Vipi
    settings:
      configs:
        Simulator:
          'EXCLUDED_ARCHS[sdk=iphonesimulator*]': ''
          OTHER_LDFLAGS: '-lsqlite3 -lc++'
      base:
        GENERATE_INFOPLIST_FILE: YES
        'LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]': $(inherited) $(SRCROOT)/../vendor/libsignal/target/aarch64-apple-ios-sim/release
        'LIBRARY_SEARCH_PATHS[sdk=iphoneos*]': $(inherited) $(SRCROOT)/../vendor/libsignal/target/aarch64-apple-ios/release
  VipiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VipiUITests]
    dependencies:
      - target: Vipi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Vipi:
    build:
      targets:
        Vipi: all
    test:
      targets: [VipiCryptoTests, VipiUITests]
  VipiSimulator:
    build:
      targets:
        Vipi: all
    run:
      config: Simulator
    test:
      config: Simulator
      targets: [VipiCryptoTests, VipiUITests]
  VipiStoreKitTests:
    build:
      targets:
        Vipi: all
    run:
      config: Simulator
      storeKitConfiguration: VipiCryptoTests/StoreKit/Vipi.storekit
    test:
      config: Simulator
      targets:
        - name: VipiCryptoTests
          selectedTests: [SubscriptionStoreTests]
