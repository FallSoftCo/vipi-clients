[project]
name = "vipi-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1",
  "PyJWT[crypto]==2.15.1", "SQLAlchemy[asyncio]==2.1.6", "asyncpg==0.32.0",
  "cryptography==50.0.2", "pydantic-settings==2.16.1", "alembic==1.20.1"
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "aiosqlite==0.22.1"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["vipi*"]

[tool.setuptools.package-data]
vipi = ["*.css"]
